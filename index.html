<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VilarNet</title>
    <meta name="theme-color" content="#1a1a2e">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JNN88E345T"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-JNN88E345T');
    </script>
</head>

<body>
    <div class="app-container">
        <div class="radio-glass">
            <header class="radio-header">
                <div class="logo-container">
                    <div class="logo-image">
                        <img src="img/logo_1.png" alt="Logo Radio FM">
                    </div>
                    <h1>VilarNet<span></span></h1>
                </div>
                <p class="frequency">FM</p>
            </header>

            <main class="radio-main">
                <div class="visualizer-container">
                    <div class="equalizer wave-eq" aria-hidden="true">
                        <div class="wave-row" style="--index: 0"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 1"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 2"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 3"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 4"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 5"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 6"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 7"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                        <div class="wave-row" style="--index: 8"><span class="wave-bar left"></span><span class="wave-core"></span><span class="wave-bar right"></span></div>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="station-info">
                        <h2 class="station-name">Radio Vilardevoz</h2>
                        <p class="song-info" id="songInfo">Sábados de 9:30 a 14hs</p>
                    </div>

                    <div class="controls">
                        <div class="controls-row controls-row-main">
                            <button id="playBtn" class="control-btn action-btn">
                                <i class="fas fa-play"></i>
                                <span>Reproducir</span>
                            </button>
                            <button id="pauseBtn" class="control-btn action-btn">
                                <i class="fas fa-pause"></i>
                                <span>Pausa</span>
                            </button>
                        </div>
                        <p class="volume-status" id="volumeStatus">Volumen actual: 70%</p>
                        <div class="controls-row controls-row-volume">
                            <button id="volumeDownBtn" class="control-btn action-btn volume-btn">
                                <i class="fas fa-volume-down"></i>
                                <span>Vol -</span>
                            </button>
                            <button id="volumeDefaultBtn" class="control-btn action-btn volume-btn" aria-label="Volumen optimo">
                                <i class="fas fa-volume-up" id="volumeIcon"></i>
                                <span class="label-full">Vol optimo</span>
                                <span class="label-short" aria-hidden="true">Optimo</span>
                            </button>
                            <button id="volumeUpBtn" class="control-btn action-btn volume-btn">
                                <i class="fas fa-volume-high"></i>
                                <span>Vol +</span>
                            </button>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="radio-footer">
                <p class="status" id="statusText"><i class="fas fa-circle"></i> En línea</p>
                <p class="copyright">
                    <span>© <span id="currentYear"></span> Radio FM</span>
                    <span>App Web creada por el Desarrollador Alfredo Carro</span>
                </p>
                <nav class="social-links" aria-label="Redes sociales de Radio Vilardevoz">
                    <a href="https://www.instagram.com/radio.vilardevoz/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://www.facebook.com/people/Radio-Vilardevoz/100064359922914/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                    <a href="https://www.youtube.com/@radiovilardevoz" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>
                    <a href="https://radiovilardevoz.org/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Página web">
                        <i class="fa-solid fa-globe"></i>
                    </a>
                    <a href="https://www.ivoox.com/escuchar-audios-radio-vilardevoz-95-1-fm_al_1849949_1.html?show=programs" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="iVoox">
                        <i class="fa-solid fa-podcast"></i>
                    </a>
                </nav>
            </footer>
        </div>
    </div>

    <audio id="radioStream" crossorigin="anonymous" preload="none">
        <source src="https://stream.codigosur.org/RadioVilardevoz.ogg" type="audio/ogg">
        <p>Tu navegador no soporta el elemento de audio.</p>
    </audio>


    
    <script src="app.js"></script>
</body>

</html>
